<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-family:"Segoe UI",system-ui,sans-serif; background:#0f0b14; color:#eef0ff; }
  h1 { font-size:1.4rem; margin:0; }
  p.hint { color:#9aa3c7; font-size:.85rem; margin:0; }
  canvas { background:#140f18; border-radius:12px; touch-action:none; }
  #score { color:#ff5cae; font-weight:700; }
</style>
</head>
<body>
<h1>Snake</h1>
<p class="hint">Arrows / WASD / swipe &middot; Score: <span id="score">0</span></p>
<canvas id="c" width="400" height="400"></canvas>
<script>
(function () {
  var c = document.getElementById("c"), ctx = c.getContext("2d");
  var grid = 20, cells = c.width / grid;
  var snake, dir, next, food, score, dead, timer, scoreEl = document.getElementById("score");

  function reset() {
    snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
    dir = {x:1,y:0}; next = dir; food = spawn(); score = 0; dead = false;
    scoreEl.textContent = "0";
    clearInterval(timer);
    timer = setInterval(step, 110);
    draw();
  }
  function spawn() {
    while (true) {
      var p = { x: Math.floor(Math.random()*cells), y: Math.floor(Math.random()*cells) };
      if (!snake.some(function (s) { return s.x === p.x && s.y === p.y; })) return p;
    }
  }
  function step() {
    if (dead) return;
    dir = next;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells || snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      dead = true; clearInterval(timer); draw(); return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score += 10; scoreEl.textContent = score; food = spawn(); }
    else snake.pop();
    draw();
  }
  function draw() {
    ctx.fillStyle = "#0f0b14"; ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle = "#ff5cae"; ctx.fillRect(food.x*grid+3, food.y*grid+3, grid-6, grid-6);
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? "#ff9ad5" : "#b95c8f";
      ctx.fillRect(s.x*grid+2, s.y*grid+2, grid-4, grid-4);
    });
    if (dead) {
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle = "#fff"; ctx.font = "bold 26px Segoe UI"; ctx.textAlign = "center";
      ctx.fillText("Game Over", c.width/2, c.height/2 - 8);
      ctx.font = "16px Segoe UI"; ctx.fillText("Press R / tap to restart", c.width/2, c.height/2 + 22);
    }
  }
  function setDir(x, y) { if (x === -dir.x && y === -dir.y) return; next = {x:x,y:y}; }
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" || e.key === "w") setDir(0,-1);
    if (e.key === "ArrowDown" || e.key === "s") setDir(0,1);
    if (e.key === "ArrowLeft" || e.key === "a") setDir(-1,0);
    if (e.key === "ArrowRight" || e.key === "d") setDir(1,0);
    if (e.key === "r" && dead) reset();
  });
  var sx, sy;
  c.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; if (dead) reset(); }, {passive:true});
  c.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy)) { if (dx > 0) setDir(1,0); else setDir(-1,0); }
    else { if (dy > 0) setDir(0,1); else setDir(0,-1); }
  }, {passive:true});
  c.addEventListener("click", function () { if (dead) reset(); });
  reset();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Memory</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; font-family:"Segoe UI",system-ui,sans-serif; background:#0f0b14; color:#eef0ff; }
  h1 { font-size:1.4rem; margin:0; }
  .bar { color:#9aa3c7; font-size:.9rem; } .bar b { color:#ff5cae; }
  #grid { display:grid; grid-template-columns:repeat(4,80px); gap:10px; }
  .card { width:80px; height:80px; border:0; border-radius:12px; background:#241a2c; font-size:2rem; cursor:pointer; color:transparent; transition:background .15s, transform .15s; }
  .card.flip { background:#3a2a44; color:#fff; transform:rotateY(0); }
  .card.done { background:#3a1d4e; color:#fff; cursor:default; }
  button.reset { border:0; border-radius:10px; padding:10px 18px; background:#ff5cae; color:#2a0417; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<h1>Memory</h1>
<div class="bar">Moves: <b id="moves">0</b> &middot; Matched: <b id="pairs">0</b>/8</div>
<div id="grid"></div>
<button class="reset" id="reset">New game</button>
<script>
(function () {
  var grid = document.getElementById("grid");
  var emojis = ["\uD83C\uDF6A","\uD83D\uDE80","\uD83C\uDF4E","\u26BD","\uD83C\uDFB8","\uD83D\uDC3C","\uD83C\uDF08","\uD83D\uDD25"];
  var first = null, lock = false, moves = 0, pairs = 0;
  function shuffle(a) { for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function reset() {
    first = null; lock = false; moves = 0; pairs = 0;
    document.getElementById("moves").textContent = "0";
    document.getElementById("pairs").textContent = "0";
    var deck = shuffle(emojis.concat(emojis));
    grid.innerHTML = "";
    deck.forEach(function (e) {
      var b = document.createElement("button");
      b.className = "card"; b.dataset.e = e;
      b.addEventListener("click", function () { flip(b); });
      grid.appendChild(b);
    });
  }
  function flip(b) {
    if (lock || b.classList.contains("flip") || b.classList.contains("done")) return;
    b.classList.add("flip"); b.textContent = b.dataset.e;
    if (!first) { first = b; return; }
    moves++; document.getElementById("moves").textContent = moves;
    if (first.dataset.e === b.dataset.e) {
      first.classList.add("done"); b.classList.add("done");
      first = null; pairs++; document.getElementById("pairs").textContent = pairs;
      if (pairs === 8) setTimeout(function () { alert("You won in " + moves + " moves!"); }, 200);
    } else {
      lock = true;
      var f = first; first = null;
      setTimeout(function () { f.classList.remove("flip"); b.classList.remove("flip"); f.textContent = ""; b.textContent = ""; lock = false; }, 750);
    }
  }
  document.getElementById("reset").addEventListener("click", reset);
  reset();
})();
</script>
</body>
</html>

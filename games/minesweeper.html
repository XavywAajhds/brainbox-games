<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minesweeper</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-family:"Segoe UI",system-ui,sans-serif; background:#0f0b14; color:#eef0ff; }
  h1 { font-size:1.4rem; margin:0; }
  .bar { color:#9aa3c7; font-size:.9rem; } .bar b { color:#ff5cae; }
  #grid { display:grid; grid-template-columns:repeat(9,36px); gap:3px; }
  .cell { width:36px; height:36px; border:0; border-radius:6px; background:#3a2a44; color:#fff; font-size:1rem; font-weight:700; cursor:pointer; }
  .cell:hover:not(.open) { background:#4a3554; }
  .cell.open { background:#1a1220; cursor:default; }
  .cell.mine { background:#7a1048; }
  .cell.flag { color:#ffd54a; }
  button.reset { border:0; border-radius:10px; padding:10px 18px; background:#ff5cae; color:#2a0417; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<h1>Minesweeper</h1>
<div class="bar">Mines: <b id="mines">10</b> &middot; Status: <b id="status">playing</b></div>
<div id="grid"></div>
<button class="reset" id="reset">New game</button>
<script>
(function () {
  var N = 9, MINES = 10;
  var grid = document.getElementById("grid");
  var cells, mineMap, over;
  function reset() {
    over = false; cells = []; mineMap = [];
    document.getElementById("status").textContent = "playing";
    var spots = [];
    for (var i=0;i<N*N;i++) spots.push(i);
    for (var i=spots.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=spots[i]; spots[i]=spots[j]; spots[j]=t; }
    mineMap = new Array(N*N).fill(false);
    spots.slice(0, MINES).forEach(function (s) { mineMap[s] = true; });
    grid.innerHTML = "";
    for (var i=0;i<N*N;i++) {
      (function (i) {
        var b = document.createElement("button");
        b.className = "cell"; b.dataset.i = i;
        b.addEventListener("click", function () { open(i, b); });
        b.addEventListener("contextmenu", function (e) { e.preventDefault(); flag(b); });
        grid.appendChild(b); cells.push(b);
      })(i);
    }
  }
  function neighbors(i) {
    var r = Math.floor(i/N), c = i%N, out = [];
    for (var dr=-1;dr<=1;dr++) for (var dc=-1;dc<=1;dc++) {
      if (!dr && !dc) continue;
      var nr=r+dr, nc=c+dc;
      if (nr>=0 && nr<N && nc>=0 && nc<N) out.push(nr*N+nc);
    }
    return out;
  }
  function open(i, b) {
    if (over || b.classList.contains("open") || b.classList.contains("flag")) return;
    if (mineMap[i]) { b.classList.add("open","mine"); b.textContent = "\uD83D\uDCA3"; lose(); return; }
    var count = neighbors(i).filter(function (n) { return mineMap[n]; }).length;
    b.classList.add("open");
    b.textContent = count || "";
    if (count) b.style.color = ["","#ff5cae","#ffb3e6","#ffd54a","#7ad1ff","#9cff7a","#c9a0ff","#fff","#aaa"][count];
    if (count === 0) neighbors(i).forEach(function (n) { open(n, cells[n]); });
    checkWin();
  }
  function flag(b) {
    if (over || b.classList.contains("open")) return;
    b.classList.toggle("flag");
    b.textContent = b.classList.contains("flag") ? "\uD83D\uDEA9" : "";
  }
  function lose() {
    over = true; document.getElementById("status").textContent = "lost";
    mineMap.forEach(function (m, i) { if (m && !cells[i].classList.contains("flag")) { cells[i].classList.add("open","mine"); cells[i].textContent = "\uD83D\uDCA3"; } });
  }
  function checkWin() {
    var opened = cells.filter(function (b) { return b.classList.contains("open"); }).length;
    if (opened === N*N - MINES) { over = true; document.getElementById("status").textContent = "won"; }
  }
  document.getElementById("reset").addEventListener("click", reset);
  reset();
})();
</script>
</body>
</html>

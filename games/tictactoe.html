<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tic-Tac-Toe</title>
<style>
  :root { --accent:#ff5cae; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; font-family:"Segoe UI",system-ui,sans-serif; background:#0f0b14; color:#eef0ff; }
  h1 { font-size:1.4rem; margin:0; }
  #board { display:grid; grid-template-columns:repeat(3,92px); gap:8px; }
  #board button { width:92px; height:92px; font-size:2.6rem; font-weight:700; border:0; border-radius:12px; background:#1c1424; color:#eef0ff; cursor:pointer; }
  #board button:hover:not(:disabled) { background:#2a1e35; }
  #board button.win { background:#3a1d4e; color:var(--accent); }
  #status { min-height:22px; color:#9aa3c7; }
  #reset { border:0; border-radius:10px; padding:10px 20px; background:var(--accent); color:#2a0417; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div id="board"></div>
  <div id="status"></div>
  <button id="reset">New game</button>
<script>
(function () {
  var board = document.getElementById("board");
  var status = document.getElementById("status");
  var cells = [], turn = "X", over = false;
  var wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function reset() {
    cells = ["","","","","","","","",""]; turn = "X"; over = false; status.textContent = "X to move";
    board.innerHTML = "";
    for (var i = 0; i < 9; i++) {
      (function (i) {
        var b = document.createElement("button");
        b.addEventListener("click", function () { play(i, b); });
        board.appendChild(b);
      })(i);
    }
  }
  function play(i, b) {
    if (over || cells[i]) return;
    cells[i] = turn; b.textContent = turn;
    var w = winner();
    if (w) { over = true; status.textContent = w + " wins!"; highlight(w); return; }
    if (cells.every(function (c) { return c; })) { over = true; status.textContent = "Draw!"; return; }
    turn = turn === "X" ? "O" : "X"; status.textContent = turn + " to move";
  }
  function winner() {
    for (var k = 0; k < wins.length; k++) {
      var a = wins[k];
      if (cells[a[0]] && cells[a[0]] === cells[a[1]] && cells[a[1]] === cells[a[2]]) return cells[a[0]];
    }
    return null;
  }
  function highlight(w) {
    wins.forEach(function (a) {
      if (cells[a[0]] === w && cells[a[1]] === w && cells[a[2]] === w) {
        a.forEach(function (idx) { board.children[idx].classList.add("win"); });
      }
    });
  }
  document.getElementById("reset").addEventListener("click", reset);
  reset();
})();
</script>
</body>
</html>

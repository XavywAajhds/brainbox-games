<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake | BrainBox</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
  <h1>Sna<span>ke</span></h1>
  <p>Eat, grow, and don't hit the walls or yourself</p>
</header>

<div class="wrap">
  <a class="back" href="index.html">&larr; Back to games</a>

  <div class="game-box">
    <div class="score-bar">
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="best">0</strong></span>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="feedback" id="feedback">Arrow keys or WASD to move</div>
    <p style="margin-top:14px"><button class="btn primary" id="restart">New game</button></p>
  </div>
</div>

<script>
(function () {
  var c = document.getElementById("game");
  var ctx = c.getContext("2d");
  var CELL = 20, COLS = 20, ROWS = 20;

  var snake, dir, nextDir, food, score, best = 0, alive, running, tick;

  function randomFood() {
    do {
      food = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
  }

  function start() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    alive = true;
    document.getElementById("score").textContent = 0;
    document.getElementById("feedback").textContent = "Go!";
    randomFood();
    render();
    running = true;
  }

  function render() {
    ctx.fillStyle = "#12162a";
    ctx.fillRect(0, 0, 400, 400);

    ctx.fillStyle = "#b5e48c";
    ctx.fillRect(food.x * CELL, food.y * CELL, CELL - 1, CELL - 1);

    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? "#4cc9f0" : "#2a3155";
      ctx.fillRect(s.x * CELL, s.y * CELL, CELL - 1, CELL - 1);
    });
  }

  function step() {
    if (!alive) return;
    dir = nextDir;

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    var hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    var hitSelf = snake.some(function (s) { return s.x === head.x && s.y === head.y; });

    if (hitWall || hitSelf) {
      alive = false;
      running = false;
      document.getElementById("feedback").textContent = "Game over - score " + score;
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      document.getElementById("score").textContent = score;
      if (score > best) {
        best = score;
        document.getElementById("best").textContent = best;
      }
      randomFood();
    } else {
      snake.pop();
    }

    render();
  }

  document.addEventListener("keydown", function (e) {
    var key = e.key.toLowerCase();
    if (key === "arrowup" || key === "w") nextDir = { x: 0, y: -1 };
    else if (key === "arrowdown" || key === "s") nextDir = { x: 0, y: 1 };
    else if (key === "arrowleft" || key === "a") nextDir = { x: -1, y: 0 };
    else if (key === "arrowright" || key === "d") nextDir = { x: 1, y: 0 };
    else return;
    e.preventDefault();
    if (nextDir.x === -dir.x && nextDir.y === -dir.y) nextDir = dir;
    if (!running) { start(); return; }
  });

  document.getElementById("restart").onclick = start;
  tick = setInterval(step, 90);
  start();
})();
</script>
</body>
</html>

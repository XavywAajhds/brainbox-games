<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Games</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav class="nav">
  <div class="brand">Games</div>
  <form class="search" action="https://duckduckgo.com/" method="get" target="_blank" rel="noopener">
    <input type="text" name="q" placeholder="Search the web..." autocomplete="off" />
    <button type="submit" aria-label="Search">&#128269;</button>
  </form>
</nav>

<main class="wrap">
  <h1 class="page-title">Minecraft Clients</h1>
  <div class="grid" id="clients">
    <a class="card" href="mc-1.8.8.html" data-src="mc-1.8.8.html" data-title="Minecraft 1.8.8" title="EaglercraftX 1.8.8">
      <img class="mc-logo" src="https://www.minecraft.net/content/dam/minecraftnet/logos/logo-minecraft-500x500.png" alt="Minecraft" />
      <h2>Minecraft 1.8.8</h2>
      <p class="ver">EaglercraftX &bull; 1.8.8</p>
    </a>
    <a class="card" href="mc-1.12.2.html" data-src="mc-1.12.2.html" data-title="Minecraft 1.12.2" title="Eaglercraft 1.12.2">
      <img class="mc-logo" src="https://www.minecraft.net/content/dam/minecraftnet/logos/logo-minecraft-500x500.png" alt="Minecraft" />
      <h2>Minecraft 1.12.2</h2>
      <p class="ver">Eaglercraft &bull; 1.12.2</p>
    </a>
    <a class="card" href="mc-1.5.2.html" data-src="mc-1.5.2.html" data-title="Minecraft 1.5.2" title="Eaglercraft 1.5.2">
      <img class="mc-logo" src="https://www.minecraft.net/content/dam/minecraftnet/logos/logo-minecraft-500x500.png" alt="Minecraft" />
      <h2>Minecraft 1.5.2</h2>
      <p class="ver">Eaglercraft &bull; 1.5.2</p>
    </a>
    <a class="card" href="mc-beta-1.7.3.html" data-src="mc-beta-1.7.3.html" data-title="Minecraft Beta 1.7.3" title="Eaglercraft Beta 1.7.3">
      <img class="mc-logo" src="https://www.minecraft.net/content/dam/minecraftnet/logos/logo-minecraft-500x500.png" alt="Minecraft" />
      <h2>Minecraft Beta 1.7.3</h2>
      <p class="ver">Eaglercraft Beta &bull; 1.7.3</p>
    </a>
    <a class="card" href="mc-alpha-1.2.6.html" data-src="mc-alpha-1.2.6.html" data-title="Minecraft Alpha 1.2.6" title="Eaglercraft Alpha 1.2.6">
      <img class="mc-logo" src="https://www.minecraft.net/content/dam/minecraftnet/logos/logo-minecraft-500x500.png" alt="Minecraft" />
      <h2>Minecraft Alpha 1.2.6</h2>
      <p class="ver">Eaglercraft Alpha &bull; 1.2.6</p>
    </a>
  </div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="win" id="win">
    <div class="win-bar">
      <span class="win-title" id="winTitle">Minecraft</span>
      <div class="win-btns">
        <a class="win-btn" id="openTab" href="#" target="_blank" rel="noopener" title="Open in new tab">&#8599;</a>
        <button class="win-btn" id="fsBtn" type="button" title="Toggle fullscreen">&#9974;</button>
        <button class="win-btn" id="closeBtn" type="button" title="Close">&#10005;</button>
      </div>
    </div>
    <div class="win-body">
      <div class="win-loading" id="winLoad">Loading client...</div>
      <iframe id="frame" title="Minecraft" allowfullscreen allow="autoplay; fullscreen; gamepad; clipboard-read; cross-origin-isolated"></iframe>
    </div>
  </div>
</div>

<script>
(function () {
  var overlay = document.getElementById("overlay");
  var win = document.getElementById("win");
  var frame = document.getElementById("frame");
  var titleEl = document.getElementById("winTitle");
  var loading = document.getElementById("winLoading");
  var openTab = document.getElementById("openTab");
  var fsBtn = document.getElementById("fsBtn");
  var closeBtn = document.getElementById("closeBtn");

  function open(src, title) {
    titleEl.textContent = title;
    openTab.href = src;
overlay.hidden = false;
    loading.hidden = false;
    frame.src = "about:blank";
    frame.src = src;
  }

  document.getElementById("clients").addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (!card) return;
    e.preventDefault();
    open(card.getAttribute("data-src"), card.getAttribute("data-title"));
  });

  frame.addEventListener("load", function () {
    if (frame.src && frame.src.indexOf("about:blank") === -1) {
      document.getElementById("winLoading").hidden = true;
    }
  });

  function closeWin() {
    if (document.fullscreenElement) document.exitFullscreen();
    frame.src = "about:blank";
    document.getElementById("overlay").hidden = true;
  }
  document.getElementById("closeBtn").addEventListener("click", closeWin);

  function toggleFs() {
    var win = document.getElementById("win");
    if (!document.fullscreenElement) {
      if (win.requestFullscreen) win.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }
  document.getElementById("fsBtn").addEventListener("click", toggleFs);

  document.addEventListener("fullscreenchange", function () {
    document.getElementById("fsBtn").innerHTML = document.fullscreenElement ? "&#10064;" : "&#9974;";
    document.getElementById("fsBtn").title = document.fullscreenElement ? "Exit fullscreen" : "Toggle fullscreen";
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.fullscreenElement && !document.getElementById("overlay").hidden) {
      closeWin();
    }
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mist.Dev</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Mist<span>.Dev</span></div>
    <nav class="tabs">
      <button class="tab active" data-page="home" type="button">
        <img src="assets/home.png" alt="" /><span>Home</span>
      </button>
      <button class="tab" data-page="games" type="button">
        <img src="assets/controller.png" alt="" /><span>Games</span>
      </button>
      <button class="tab" data-page="browser" type="button">
        <img src="assets/globe.png" alt="" /><span>Browser</span>
      </button>
    </nav>
    <div class="side-foot">v1.0</div>
  </aside>

  <main class="main">
    <section class="page active" id="page-home">
      <div class="hero">
        <h1>Welcome to <span>Mist.Dev</span></h1>
        <p>Your home for games and the web in one place. Pick a tab on the left to get started.</p>
      </div>
    </section>

    <section class="page" id="page-games">
      <h2 class="page-title">Minecraft Clients</h2>
      <div class="gamelist" id="clients">
        <button class="gtab" data-src="mc-1.8.8.html" data-title="Minecraft 1.8.8" type="button">
          <img src="assets/minecraft.png" alt="" />
          <span class="gtext"><strong>Minecraft</strong><em>EaglercraftX &bull; 1.8.8</em></span>
        </button>
        <button class="gtab" data-src="mc-1.12.2.html" data-title="Minecraft 1.12.2" type="button">
          <img src="assets/minecraft.png" alt="" />
          <span class="gtext"><strong>Minecraft</strong><em>Eaglercraft &bull; 1.12.2</em></span>
        </button>
        <button class="gtab" data-src="mc-1.5.2.html" data-title="Minecraft 1.5.2" type="button">
          <img src="assets/minecraft.png" alt="" />
          <span class="gtext"><strong>Minecraft</strong><em>Eaglercraft &bull; 1.5.2</em></span>
        </button>
        <button class="gtab" data-src="mc-beta-1.7.3.html" data-title="Minecraft Beta 1.7.3" type="button">
          <img src="assets/minecraft.png" alt="" />
          <span class="gtext"><strong>Minecraft Beta</strong><em>Eaglercraft &bull; 1.7.3</em></span>
        </button>
        <button class="gtab" data-src="mc-alpha-1.2.6.html" data-title="Minecraft Alpha 1.2.6" type="button">
          <img src="assets/minecraft.png" alt="" />
          <span class="gtext"><strong>Minecraft Alpha</strong><em>Eaglercraft &bull; 1.2.6</em></span>
        </button>
      </div>
    </section>

    <section class="page" id="page-browser">
      <div class="browser">
        <img class="globe" src="assets/globe.png" alt="" />
        <h2>Browser</h2>
        <form class="omnibox" action="https://duckduckgo.com/" method="get" target="_blank" rel="noopener">
          <input type="text" name="q" placeholder="Search DuckDuckGo or type a URL..." autocomplete="off" autofocus />
          <button type="submit">Go</button>
        </form>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="win" id="win">
    <div class="win-bar">
      <span class="win-title" id="winTitle">Minecraft</span>
      <div class="win-btns">
        <a class="win-btn" id="openTab" href="#" target="_blank" rel="noopener" title="Open in new tab">&#8599;</a>
        <button class="win-btn" id="fsBtn" type="button" title="Toggle fullscreen">&#9974;</button>
        <button class="win-btn" id="closeBtn" type="button" title="Close">&#10005;</button>
      </div>
    </div>
    <div class="win-body">
      <div class="win-loading" id="winLoading">Loading client...</div>
      <iframe id="frame" title="Minecraft" allowfullscreen allow="autoplay; fullscreen; gamepad; pointer-lock"></iframe>
    </div>
  </div>
</div>

<script>
(function () {
  var tabs = document.querySelectorAll(".tab");
  var pages = document.querySelectorAll(".page");
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      tabs.forEach(function (t) { t.classList.remove("active"); });
      pages.forEach(function (p) { p.classList.remove("active"); });
      tab.classList.add("active");
      document.getElementById("page-" + tab.dataset.page).classList.add("active");
    });
  });

  var overlay = document.getElementById("overlay");
  var win = document.getElementById("win");
  var frame = document.getElementById("frame");
  var titleEl = document.getElementById("winTitle");
  var loading = document.getElementById("winLoading");
  var openTab = document.getElementById("openTab");

  function openGame(src, title) {
    titleEl.textContent = title;
    openTab.href = src;
    overlay.hidden = false;
    loading.hidden = false;
    frame.src = "about:blank";
    frame.src = src;
  }

  document.getElementById("clients").addEventListener("click", function (e) {
    var btn = e.target.closest(".gtab");
    if (!btn) return;
    openGame(btn.dataset.src, btn.dataset.title);
  });

  frame.addEventListener("load", function () {
    if (frame.src && frame.src.indexOf("about:blank") === -1) loading.hidden = true;
  });

  function closeWin() {
    if (document.fullscreenElement) document.exitFullscreen();
    frame.src = "about:blank";
    overlay.hidden = true;
  }
  document.getElementById("closeBtn").addEventListener("click", closeWin);

  document.getElementById("fsBtn").addEventListener("click", function () {
    if (!document.fullscreenElement) {
      if (win.requestFullscreen) win.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener("fullscreenchange", function () {
    var b = document.getElementById("fsBtn");
    b.innerHTML = document.fullscreenElement ? "&#10064;" : "&#9974;";
    b.title = document.fullscreenElement ? "Exit fullscreen" : "Toggle fullscreen";
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.fullscreenElement && !overlay.hidden) closeWin();
  });
})();
</script>
</body>
</html>
